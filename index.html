<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heaven Creation - Game Zone</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    
    .wallet-card {
      background: #161b22;
      border: 2px solid #232d3f;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .wallet-title { font-size: 16px; color: #8b949e; }
    .wallet-balance { font-size: 28px; color: #00ffcc; font-weight: bold; margin: 5px 0; }
    
    .btn-action {
      background: #0088cc;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      margin: 5px;
      cursor: pointer;
      width: 40%;
    }

    .game-card {
      background: #161b22;
      border: 1px solid #232d3f;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 25px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* Aviator Style */
    .game-screen {
      position: relative;
      height: 180px;
      background: #000000;
      border-radius: 10px;
      border: 1px solid #00e6ff;
      overflow: hidden;
      margin-bottom: 15px;
    }
    .multiplier {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 38px;
      font-weight: bold;
      color: #ff3366;
      z-index: 5;
    }
    #rocket {
      position: absolute;
      font-size: 32px;
      left: 10px;
      bottom: 10px;
      transition: all 0.1s linear;
      z-index: 4;
    }

    /* Wheel Style */
    .wheel-box {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 15px auto;
    }
    #wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #00e6ff;
      transition: transform 4s cubic-bezier(0.15, 0.99, 0.15, 0.99);
    }
    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 20px solid #ff0055;
      z-index: 10;
    }

    input {
      width: 80%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #333;
      text-align: center;
      font-size: 16px;
      background: #0d1117;
      color: #fff;
    }
    
    .btn-main {
      background: #00e6ff;
      color: #000;
      border: none;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      width: 85%;
      cursor: pointer;
      margin: 4px 0;
    }
    .btn-cashout {
      background: #00cc66;
      color: #fff;
    }
    button:disabled {
      background: #444 !important;
      color: #777 !important;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Shared Wallet -->
  <div class="wallet-card">
    <div class="wallet-title">💰 والٹ (Wallet Balance)</div>
    <div class="wallet-balance">Rs. <span id="balance">1000</span></div>
    <button class="btn-action" onclick="deposit()">+ Deposit</button>
    <button class="btn-action" onclick="withdraw()">- Withdraw</button>
  </div>

  <!-- GAME 1: AVIATOR -->
  <div class="game-card">
    <h2 style="color: #ff0055; margin-top:0;">🚀 Aviator Game</h2>
    
    <div class="game-screen">
      <div id="multiplierDisplay" class="multiplier">1.00x</div>
      <div id="rocket">🚀</div>
    </div>

    <input type="number" id="aviatorBet" value="50" placeholder="شرط کی رقم">
    <br>
    <button id="betBtn" class="btn-main" onclick="placeAviatorBet()">شرط لگائیں (Bet)</button>
    <button id="cashoutBtn" class="btn-main btn-cashout" onclick="cashoutAviator()" disabled>پیسے نکالیں (Cashout)</button>
  </div>

  <!-- GAME 2: SPIN WHEEL -->
  <div class="game-card">
    <h2 style="color: #00ffcc; margin-top:0;">🎯 Spin & Win Wheel</h2>

    <div class="wheel-box">
      <div class="pointer"></div>
      <canvas id="wheel" width="200" height="200"></canvas>
    </div>

    <input type="number" id="spinBet" value="50" placeholder="شرط کی رقم">
    <br>
    <button id="spinBtn" class="btn-main" onclick="spinWheel()">چرخہ گھمائیں (Spin)</button>
    
    <div id="spinResult" style="margin-top:10px; font-weight:bold;"></div>
  </div>

  <script>
    let balance = 1000;

    function updateBalance() {
      document.getElementById("balance").innerText = balance.toFixed(0);
    }

    function deposit() {
      let amt = prompt("رقم درج کریں:", "500");
      if (amt && !isNaN(amt) && amt > 0) {
        balance += parseFloat(amt);
        updateBalance();
      }
    }

    function withdraw() {
      let amt = prompt("نکالنے کی رقم:", "200");
      if (amt && !isNaN(amt) && amt > 0 && amt <= balance) {
        balance -= parseFloat(amt);
        updateBalance();
      }
    }

    /* --- AVIATOR LOGIC --- */
    let aviatorMultiplier = 1.00;
    let aviatorInterval;
    let isAviatorRunning = false;
    let hasAviatorBet = false;
    let currentAviatorBet = 0;
    let aviatorCrashPoint = 0;

    const rocket = document.getElementById("rocket");
    const multDisplay = document.getElementById("multiplierDisplay");

    function placeAviatorBet() {
      let betVal = parseFloat(document.getElementById("aviatorBet").value);
      if (isNaN(betVal) || betVal <= 0 || betVal > balance) {
        alert("صحیح بیلنس منتخب کریں!");
        return;
      }

      currentAviatorBet = betVal;
      balance -= currentAviatorBet;
      updateBalance();

      hasAviatorBet = true;
      document.getElementById("betBtn").disabled = true;
      document.getElementById("cashoutBtn").disabled = false;

      if (!isAviatorRunning) startAviator();
    }

    function startAviator() {
      isAviatorRunning = true;
      aviatorMultiplier = 1.00;
      aviatorCrashPoint = (Math.random() * 4 + 1.1).toFixed(2);
      
      rocket.style.left = "10px";
      rocket.style.bottom = "10px";
      rocket.innerText = "🚀";

      aviatorInterval = setInterval(() => {
        aviatorMultiplier += 0.02;
        multDisplay.innerText = aviatorMultiplier.toFixed(2) + "x";

        let progress = (aviatorMultiplier - 1) / 4;
        rocket.style.left = Math.min(10 + progress * 180, 220) + "px";
        rocket.style.bottom = Math.min(10 + progress * 100, 120) + "px";

        if (aviatorMultiplier >= aviatorCrashPoint) {
          endAviator(true);
        }
      }, 100);
    }

    function cashoutAviator() {
      if (!hasAviatorBet || !isAviatorRunning) return;
      let win = Math.floor(currentAviatorBet * aviatorMultiplier);
      balance += win;
      updateBalance();
      alert(`🎉 آپ نے Rs. ${win} جیت لیے!`);
      hasAviatorBet = false;
      document.getElementById("cashoutBtn").disabled = true;
    }

    function endAviator(crashed) {
      clearInterval(aviatorInterval);
      isAviatorRunning = false;
      if (crashed) {
        rocket.innerText = "💥";
        multDisplay.innerText = "CRASHED!";
        hasAviatorBet = false;
      }
      document.getElementById("betBtn").disabled = false;
      document.getElementById("cashoutBtn").disabled = true;
    }

    /* --- SPIN WHEEL LOGIC --- */
    const segments = [
      { text: "0x", mult: 0, color: "#ff4d4d" },
      { text: "1.5x", mult: 1.5, color: "#3399ff" },
      { text: "2x", mult: 2, color: "#33cc33" },
      { text: "0.5x", mult: 0.5, color: "#ffaa00" },
      { text: "5x", mult: 5, color: "#9933ff" },
      { text: "10x", mult: 10, color: "#ff0066" }
    ];
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const numSegments = segments.length;
    const anglePerSegment = (2 * Math.PI) / numSegments;
    let currentWheelAngle = 0;
    let isSpinning = false;

    function drawWheel() {
      for (let i = 0; i < numSegments; i++) {
        const angle = i * anglePerSegment;
        ctx.beginPath();
        ctx.fillStyle = segments[i].color;
        ctx.moveTo(100, 100);
        ctx.arc(100, 100, 100, angle, angle + anglePerSegment);
        ctx.lineTo(100, 100);
        ctx.fill();

        ctx.save();
        ctx.translate(100, 100);
        ctx.rotate(angle + anglePerSegment / 2);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Arial";
        ctx.fillText(segments[i].text, 55, 5);
        ctx.restore();
      }
    }
    drawWheel();

    function spinWheel() {
      const bet = parseFloat(document.getElementById("spinBet").value);
      if (isNaN(bet) || bet <= 0 || bet > balance) {
        alert("بیلنس ناکافی ہے یا رقم صحیح نہیں!");
        return;
      }

      if (isSpinning) return;
      isSpinning = true;

      balance -= bet;
      updateBalance();
      document.getElementById("spinBtn").disabled = true;
      document.getElementById("spinResult").innerText = "چرخہ گھوم رہا ہے...";

      const randIdx = Math.floor(Math.random() * numSegments);
      const extraDeg = (360 / numSegments) * (numSegments - randIdx) - (360 / numSegments) / 2;
      currentWheelAngle += 360 * 5 + extraDeg;

      canvas.style.transform = `rotate(${currentWheelAngle}deg)`;

      setTimeout(() => {
        isSpinning = false;
        document.getElementById("spinBtn").disabled = false;
        
        const win = Math.floor(bet * segments[randIdx].mult);
        balance += win;
        updateBalance();

        if (win > 0) {
          document.getElementById("spinResult").innerText = `🎉 مبارک ہو! ${segments[randIdx].text} سے Rs. ${win} جیتے!`;
          document.getElementById("spinResult").style.color = "#00ffcc";
        } else {
          document.getElementById("spinResult").innerText = "❌ شرط ضائع ہو گئی۔";
          document.getElementById("spinResult").style.color = "#ff4d4d";
        }
      }, 4000);
    }
  </script>
</body>
</html>
