<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAVEN GAME</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .game-card {
            background: #151a23;
            border: 2px solid #283040;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        h1 {
            color: #2ed573;
            font-size: 22px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #090c10;
            border-radius: 12px;
            border: 1px solid #21262d;
            overflow: hidden;
            margin-bottom: 15px;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .multiplier-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .status {
            font-size: 15px;
            min-height: 40px;
            margin-bottom: 15px;
            color: #a0aabe;
            line-height: 1.3;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.96);
        }
        .btn-start {
            background-color: #2ed573;
            color: #000;
        }
        .btn-cashout {
            background-color: #ffa500;
            color: #000;
        }
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-card">
    <h1>🚀 HEAVEN GAME</h1>
    
    <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div class="multiplier-overlay" id="multiText">1.00x</div>
    </div>

    <div class="status" id="statusText">گیم شروع کرنے کے لیے Start دبا۔</div>

    <div class="btn-group">
        <button class="btn-start" id="startBtn" onclick="startGame()">Start Game</button>
        <button class="btn-cashout" id="cashBtn" onclick="cashOut()" disabled>Cash Out</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Auto-fit canvas to container
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    let animId;
    let currentMulti = 1.00;
    let isRunning = false;
    let crashPoint = 0;
    let progress = 0; // 0 to 1 for rocket trajectory

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (isRunning || progress > 0) {
            let startX = 20;
            let startY = canvas.height - 20;
            let endX = startX + (canvas.width - 60) * Math.min(progress, 1);
            let endY = startY - (canvas.height - 60) * Math.min(progress, 1);

            // Curve line
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(startX + (endX - startX) * 0.5, startY, endX, endY);
            ctx.strokeStyle = '#2ed573';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Rocket Icon
            ctx.save();
            ctx.translate(endX, endY);
            ctx.font = '28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🚀', 0, 0);
            ctx.restore();
        }
    }

    function gameLoop() {
        if (!isRunning) return;

        currentMulti += 0.02;
        progress += 0.008;

        document.getElementById('multiText').innerText = currentMulti.toFixed(2) + 'x';

        if (currentMulti >= crashPoint) {
            crashGame();
            return;
        }

        drawScene();
        animId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        if (isRunning) return;

        isRunning = true;
        currentMulti = 1.00;
        progress = 0;
        crashPoint = (Math.random() * 5 + 1.2).toFixed(2);

        document.getElementById('multiText').style.color = '#ffffff';
        document.getElementById('multiText').innerText = '1.00x';
        document.getElementById('statusText').innerText = '🚀 راکٹ اڑ رہا ہے... کیش آؤٹ کریں!';
        document.getElementById('startBtn').disabled = true;
        document.getElementById('cashBtn').disabled = false;

        gameLoop();
    }

    function cashOut() {
        if (!isRunning) return;

        isRunning = false;
        cancelAnimationFrame(animId);

        document.getElementById('statusText').innerText = '🎉 مبارک ہو! ' + currentMulti.toFixed(2) + 'x پر کیش آؤٹ کر لیا!';
        document.getElementById('startBtn').disabled = false;
        document.getElementById('cashBtn').disabled = true;
    }

    function crashGame() {
        isRunning = false;
        cancelAnimationFrame(animId);

        document.getElementById('multiText').style.color = '#ff4757';
        document.getElementById('statusText').innerText = '💥 کریش ہو گیا! راکٹ گر گیا۔';
        document.getElementById('startBtn').disabled = false;
        document.getElementById('cashBtn').disabled = true;

        // Draw exploded state
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = '36px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('💥', canvas.width / 2, canvas.height / 2);
    }

    drawScene();
</script>

</body>
</html>
